  <!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:linear-gradient(135deg,#ff0080,#ff8aed,#7928ca);font-family:Arial;display:flex;justify-content:center;padding:20px;min-height:100vh;margin:0}
.card{background:white;padding:25px;border-radius:15px;width:350px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{text-align:center;color:#ff0080}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:11px;background:#ff0080;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
li{background:#ffe6f3;padding:8px 10px;margin:5px 0;border-radius:6px;list-style:none}
.total{background:linear-gradient(135deg,#ff0080,#7928ca);color:white;padding:12px;border-radius:8px;text-align:center;margin-top:15px;font-weight:bold}
ul{padding:0}
</style></head>
<body><div class="card"><h2>💖 Expense Tracker</h2><p style="text-align:center;font-size:12px;color:#888">Made by Himaja ✨</p><input id="name" placeholder="Ex: Lunch"><input id="amt" type="number" placeholder="Ex: 100"><button onclick="add()">Add Expense +</button><ul id="list"></ul><div class="total" id="total">Total: $0</div></div>
<script>let t=0;function add(){let n=document.getElementById('name').value;let a=Number(document.getElementById('amt').value);if(!n||!a)return;t+=a;document.getElementById('list').innerHTML+=`<li>${n} - $${a}</li>`;document.getElementById('total').innerText='Total: $'+t;document.getElementById('name').value='';document.getElementById('amt').value='';}</script></body></html>
